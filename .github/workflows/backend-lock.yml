name: Generate Backend Lockfile

on:
  push:
    branches: [agent/laravel-backend-cms]

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[backend-lock-ready]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout backend branch
        uses: actions/checkout@v4
        with:
          ref: agent/laravel-backend-cms

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, sqlite3
          coverage: none

      - name: Resolve and audit backend dependencies
        run: |
          composer update --no-interaction --prefer-dist --no-progress
          composer audit --locked

      - name: Commit lockfile and remove temporary workflow
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/backend-lock.yml
          git add backend/composer.lock .github/workflows/backend-lock.yml
          git commit -m '[backend-lock-ready] Lock Laravel backend dependencies'
          git push origin HEAD:agent/laravel-backend-cms
