name: Pin Compatible ESLint

on:
  push:
    branches: [agent/production-hardening]

permissions:
  contents: write

jobs:
  pin:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip-eslint-pin]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/production-hardening

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Pin supported ESLint peer
        run: npm install --save-dev --save-exact eslint@9.39.5

      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit lockfile update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Pin ESLint to supported Next.js peer" || exit 0
          git push origin HEAD:agent/production-hardening
