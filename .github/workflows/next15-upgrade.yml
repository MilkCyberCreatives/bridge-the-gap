name: Upgrade Next.js Maintenance LTS

on:
  push:
    branches: [agent/production-hardening]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip-upgrade]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/production-hardening

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Upgrade Next.js and React
        run: npm install --save-exact next@15.5.21 react@19 react-dom@19

      - name: Upgrade framework type tooling
        run: npm install --save-dev --save-exact eslint-config-next@15.5.21 @types/react@19 @types/react-dom@19

      - name: Commit generated lockfile update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes were generated."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Upgrade Next.js to 15.5.21"
          git push origin HEAD:agent/production-hardening
