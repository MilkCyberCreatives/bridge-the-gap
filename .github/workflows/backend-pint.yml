name: Format Laravel Backend

on:
  push:
    branches: [agent/laravel-backend-cms]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[backend-formatted]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout backend branch
        uses: actions/checkout@v4
        with:
          ref: agent/laravel-backend-cms

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, sqlite3
          coverage: none

      - name: Install locked backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Format backend
        run: vendor/bin/pint

      - name: Commit formatting and remove temporary workflow
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/backend-pint.yml
          git add backend .github/workflows/backend-pint.yml
          git commit -m '[backend-formatted] Apply Laravel Pint formatting' || exit 0
          git push origin HEAD:agent/laravel-backend-cms
